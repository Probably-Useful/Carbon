appId: com.carbon.clipboard
productName: Carbon
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json

# Asar keeps the app packaged in a single archive.
asar: true

# better-sqlite3 is a native module; its compiled binary must live outside the
# asar archive so it can be loaded at runtime. Native deps are rebuilt against
# Electron automatically on install (npmRebuild defaults to true).
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Carbon

# Auto-update via GitHub Releases.
# Replace owner/repo with your GitHub repository, then `npm run build:win`
# and upload the artifacts (or use `electron-builder --publish always`).
publish:
  provider: github
  owner: YOUR_GITHUB_USERNAME
  repo: carbon
